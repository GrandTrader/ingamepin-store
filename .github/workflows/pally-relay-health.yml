name: Pally relay health monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: pally-relay-health-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check public relay
        id: health
        continue-on-error: true
        run: |
          check_relay() {
            response="$(curl --ipv4 --fail --silent --show-error --location --connect-timeout 10 --max-time 20 --retry 2 --retry-all-errors --retry-delay 3 https://pally-relay.ingamepin.com/health)"
            test "$response" = "ok"
          }
          check_relay || { sleep 30; check_relay; }

      - name: Open outage issue
        if: steps.health.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Pally relay is unreachable";
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            if (!issues.some((issue) => issue.title === title)) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: `The external health check failed at ${new Date().toISOString()}.\n\nEndpoint: https://pally-relay.ingamepin.com/health\n\nCheck the Hostinger VPS network, Caddy, and pally-relay services.`,
              });
            }

      - name: Close recovered outage issue
        if: steps.health.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Pally relay is unreachable";
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            for (const issue of issues.filter((item) => item.title === title)) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `The relay recovered at ${new Date().toISOString()}.`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: "closed",
              });
            }

      - name: Fail workflow during outage
        if: steps.health.outcome == 'failure'
        run: exit 1
