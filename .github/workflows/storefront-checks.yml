name: Storefront regression checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  storefront:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:storefront
      - run: npm run test:business-bank
      - run: npm run test:business-discounts
      - run: npm run test:purchase-restrictions
      - run: npm run test:fkwallet
      - run: npm run test:digiseller-fkwallet
      - run: npm run test:digiseller-stock
      - run: npm run test:manual-code-ranges
